<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Campaign Hub | Wolf Carpenters - Bathroom Remodeling</title>
    <meta name="description" content="Campaign navigation hub for Wolf Carpenters bathroom remodeling landing pages.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #E1BA47;
            --secondary-color: #010101;
            --support-color: #F5F6F7;
            --white: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #666666;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1a1a1a 100%);
            padding: 40px 20px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            line-height: 1.2;
        }

        .hub-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            height: 120px;
            width: auto;
        }

        .hub-title {
            color: var(--white);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .hub-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .campaign-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .campaign-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .campaign-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Google Ads Button */
        .btn-google {
            background: linear-gradient(135deg, #4285F4, #34A853, #FBBC05, #EA4335);
            color: var(--white);
        }

        .btn-google:hover {
            background: linear-gradient(135deg, #3367D6, #2E7D32, #F9A825, #D32F2F);
        }

        /* Meta Ads Button */
        .btn-meta {
            background: linear-gradient(135deg, #0081FB, #00C6FF);
            color: var(--white);
        }

        .btn-meta:hover {
            background: linear-gradient(135deg, #006ACC, #00A8E0);
        }

        /* TikTok Ads Button */
        .btn-tiktok {
            background: linear-gradient(135deg, #000000, #69C9D0, #EE1D52);
            color: var(--white);
        }

        .btn-tiktok:hover {
            background: linear-gradient(135deg, #1a1a1a, #4FB3BA, #D91A47);
        }

        /* Organic Button */
        .btn-organic {
            background: var(--primary-color);
            color: var(--secondary-color);
        }

        .btn-organic:hover {
            background: #c9a03d;
        }

        .campaign-icon {
            font-size: 1.5rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .hub-footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .hub-title {
                font-size: 1.5rem;
            }

            .campaign-btn {
                padding: 18px 25px;
                font-size: 1rem;
            }

            .logo img {
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="logo">
            <img src="0 - Brand Logo/brand-logo-wolfcarpenters.png" alt="Wolf Carpenters Logo">
        </div>
        
        <h1 class="hub-title">Campaign Landing Pages</h1>
        <p class="hub-subtitle">Select the traffic source to access the corresponding landing page with tracking enabled.</p>
        
        <div class="campaign-buttons">
            <a href="/google/" class="campaign-btn btn-google">
                <span class="campaign-icon">🔍</span>
                <span>Google Ads</span>
            </a>
            
            <a href="/meta/" class="campaign-btn btn-meta">
                <span class="campaign-icon">📘</span>
                <span>Meta Ads (Facebook/Instagram)</span>
            </a>
            
            <a href="/tiktok/" class="campaign-btn btn-tiktok">
                <span class="campaign-icon">🎵</span>
                <span>TikTok Ads</span>
            </a>
        </div>
        
        <div class="divider">or</div>
        
        <a href="/organic/" class="campaign-btn btn-organic">
            <span class="campaign-icon">🌿</span>
            <span>Organic Traffic / Direct Access</span>
        </a>
        
        <div class="hub-footer">
            <p>Wolf Carpenters © 2025 | Internal Campaign Hub</p>
        </div>
    </div>

</body>
</html>
